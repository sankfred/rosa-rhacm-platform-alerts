apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-ruler-custom-rules
  namespace: open-cluster-management-observability
data:
  custom_rules.yaml: |
    groups:
      - name: cluster-health
        rules:
        - alert: PlatformAlert
          annotations:
            summary: Notify when alert is firing
            description: "Cluster {{ $labels.cluster }} has alert {{ $labels.alertname }} firing with severity {{ $labels.severity }}" 
          expr: |
            #Example queries below - pick one
            #Simple query
            ALERTS{alertstate="firing",severity!~"info|none"}
            #Complex query to include RHACM clusterSet[prod|dev|si] for further classification and routing
            sum without(clusterID) (label_replace(ALERTS{alertstate="firing",severity="critical"}, "managed_cluster_id", "$1", "clusterID", "(.*)")) * on 
            (managed_cluster_id) group_left(clusterSet) sum(label_replace(acm_managed_cluster_labels, "clusterSet", "$1", "cluster_open_cluster_management_io_clusterset", 
            "(.*)")) without(cluster_open_cluster_management_io_clusterset)
          for: 1m
          labels:
            cluster: "{{ $labels.cluster }}"
            alertname: "{{ $labels.alertname }}"
            severity: "{{ $labels.severity }}"